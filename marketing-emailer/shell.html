<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Agentic Workforce for Operational Excellence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body
    style="font-family: 'Poppins', sans-serif;margin:0; padding:0; background-color:#eef0f6; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
    <!-- Outer wrapper -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
        style="background-color:#eef0f6; margin:0; padding:0;">
        <tr>
            <td align="center" style="padding:32px 16px;">

                <!-- Email container -->
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                    style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #e8e9f0;">

                    <!-- Logo -->
                    <tr>
                        <td align="center" style="padding:28px 24px; background-color:#ffffff;">
                            <a href="https://www.knowella.com/" target="_blank"
                                style="text-decoration:none;display: inline-block;">
                                <img src="{asset:logo}" width="140" height="25" alt="Knowella"
                                    style="display:block; border:0; outline:none; text-decoration:none; height:25px; width:140px;">
                            </a>
                        </td>
                    </tr>

                    <!-- Header banner -->
                    <tr>
                        <td style="background-color:#f4f2fb;">
                            <img src="{asset:header-banner}" width="600"
                                alt="Agentic Workforce for operational excellence"
                                style="display:block; border:0; outline:none; text-decoration:none; width:100%; max-width:600px; height:auto;">
                        </td>
                    </tr>

                    <!-- ISSUE COPY. Everything above and below is the shell and does
                         not change between issues; the slot below is replaced with
                         whatever you write in the composer. The typography lives on this cell so
                         the paragraphs inherit it and need no styling of their own. -->
                    <tr>
                        <td style="padding:32px 40px 8px 40px; font-family:'Poppins', Helvetica, Arial, sans-serif; font-size:16px; line-height:26px; color:#45556C;">
{content}
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="border-top:1px solid #e8e9f0; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding:24px 24px 24px 24px; background-color:rgba(110, 99, 255, 0.08);">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="padding:0 4px;">
                                        <table role="presentation" width="36" height="36" cellpadding="0"
                                            cellspacing="0" border="0"
                                            style="background-color:rgba(110, 99, 255, 0.12); border-radius:50%; width:36px; height:36px;">
                                            <tr>
                                                <td align="center" valign="middle" style="width:36px; height:36px;">
                                                    <a href="https://www.facebook.com/knowella/" style="text-decoration:none;"><img
                                                            src="{asset:facebook}" width="18" height="18"
                                                            alt="Facebook" style="display:block; border:0;"></a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td style="padding:0 4px;">
                                        <table role="presentation" width="36" height="36" cellpadding="0"
                                            cellspacing="0" border="0"
                                            style="background-color:rgba(110, 99, 255, 0.12); border-radius:50%; width:36px; height:36px;">
                                            <tr>
                                                <td align="center" valign="middle" style="width:36px; height:36px;">
                                                    <a href="https://www.instagram.com/knowella/" style="text-decoration:none;"><img
                                                            src="{asset:instagram}" width="18" height="18"
                                                            alt="Instagram" style="display:block; border:0;"></a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td style="padding:0 4px;">
                                        <table role="presentation" width="36" height="36" cellpadding="0"
                                            cellspacing="0" border="0"
                                            style="background-color:rgba(110, 99, 255, 0.12); border-radius:50%; width:36px; height:36px;">
                                            <tr>
                                                <td align="center" valign="middle" style="width:36px; height:36px;">
                                                    <a href="https://www.youtube.com/@knowella" style="text-decoration:none;"><img
                                                            src="{asset:youtube}" width="18" height="18"
                                                            alt="YouTube" style="display:block; border:0;"></a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td style="padding:0 4px;">
                                        <table role="presentation" width="36" height="36" cellpadding="0"
                                            cellspacing="0" border="0"
                                            style="background-color:rgba(110, 99, 255, 0.12); border-radius:50%; width:36px; height:36px;">
                                            <tr>
                                                <td align="center" valign="middle" style="width:36px; height:36px;">
                                                    <a href="https://www.linkedin.com/company/knowella/" style="text-decoration:none;"><img
                                                            src="{asset:linkedin}" width="18" height="18"
                                                            alt="LinkedIn" style="display:block; border:0;"></a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td style="padding:0 4px;">
                                        <table role="presentation" width="36" height="36" cellpadding="0"
                                            cellspacing="0" border="0"
                                            style="background-color:rgba(110, 99, 255, 0.12); border-radius:50%; width:36px; height:36px;">
                                            <tr>
                                                <td align="center" valign="middle" style="width:36px; height:36px;">
                                                    <a href="https://x.com/knowella" style="text-decoration:none;"><img
                                                            src="{asset:twitterx}" width="16" height="16" alt="X"
                                                            style="display:block; border:0;"></a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td align="center"
                            style="padding:0 24px 24px 24px; background-color:rgba(110, 99, 255, 0.08); font-family:'Poppins', sans-serif; font-size:12px; line-height:16px; color:#464E57;">
                            Copyright &copy; 2026 Knowella AI Inc.
                        </td>
                    </tr>

                </table>
                <!-- End email container -->

            </td>
        </tr>
                    <tr>
                        <td align="center" style="padding:0 24px 22px 24px; background-color:rgba(110, 99, 255, 0.08); font-family:'Poppins', Helvetica, Arial, sans-serif; font-size:11px; line-height:18px; color:#8F97A6;">
                            <a href="{preferences_url}" style="color:#8F97A6; text-decoration:underline;">Choose what you get</a>
                            &nbsp;&middot;&nbsp;
                            <a href="{{{ pm:unsubscribe }}}" style="color:#8F97A6; text-decoration:underline;">Unsubscribe</a>
                        </td>
                    </tr>

    </table>
    <!-- End outer wrapper -->
</body>

</html>
